<?xml version="1.0" encoding="UTF-8"?>
<!--
  Panel cheatsheet for the warps_drone firmware variant on Warps.
  Left half (0..50.5 mm) is the printable 10 HP sticker overlay.
  Right half is an off-panel legend showing the 8 chord zones and
  their LED colours.
  Open in a browser to preview, or in Inkscape/Illustrator to edit
  before printing as sticker overlays.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="100mm" height="128.5mm"
     viewBox="0 0 100 128.5"
     font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">

  <!-- ============== panel base (10 HP sticker area) ============== -->
  <rect x="0" y="0" width="50.5" height="128.5"
        fill="#0a0a0a" stroke="#000" stroke-width="0.2"/>

  <!-- mounting holes (cosmetic) -->
  <g fill="#1a1a1a">
    <circle cx="3.0"  cy="3.0"   r="1.5"/>
    <circle cx="47.5" cy="3.0"   r="1.5"/>
    <circle cx="3.0"  cy="125.5" r="1.5"/>
    <circle cx="47.5" cy="125.5" r="1.5"/>
  </g>

  <!-- title -->
  <text x="25.25" y="6.5" font-size="2.8" font-weight="700"
        fill="#fff" text-anchor="middle" letter-spacing="0.4">
    DRONE
  </text>
  <text x="25.25" y="9.5" font-size="1.6" font-weight="400"
        fill="#888" text-anchor="middle" letter-spacing="0.5">
    karplus + reverb fw
  </text>
  <line x1="3" y1="11" x2="47.5" y2="11" stroke="#444" stroke-width="0.15"/>

  <!-- ============== ALGORITHM big knob ============== -->
  <circle cx="25.25" cy="33" r="11" fill="#1a1a1a" stroke="#fff" stroke-width="0.3"/>
  <circle cx="25.25" cy="33" r="9.5" fill="#fafafa"/>
  <line x1="25.25" y1="33" x2="25.25" y2="24.5" stroke="#000" stroke-width="0.5" stroke-linecap="round"/>

  <text x="25.25" y="50" font-size="2.8" font-weight="700"
        fill="#fff" text-anchor="middle" letter-spacing="0.3">
    CHORD
  </text>
  <text x="25.25" y="53.2" font-size="1.6" font-weight="400"
        fill="#7fc8ff" text-anchor="middle" letter-spacing="0.3">
    + hold → PITCH
  </text>

  <!-- ============== button + OSC LED ============== -->
  <circle cx="9.5"  cy="65" r="2.2" fill="#fafafa" stroke="#fff" stroke-width="0.2"/>
  <circle cx="13.8" cy="63.5" r="0.7" fill="#30ff30"/>

  <text x="9.5" y="69.5" font-size="1.5" font-weight="700"
        fill="#fff" text-anchor="middle" letter-spacing="0.2">
    BUTTON
  </text>
  <text x="9.5" y="71.5" font-size="1.1" fill="#aaa" text-anchor="middle">tap = pluck</text>
  <text x="9.5" y="73.0" font-size="1.1" fill="#7fc8ff" text-anchor="middle">hold = shift</text>

  <!-- ============== TIMBRE medium knob ============== -->
  <circle cx="33" cy="65" r="5.5" fill="#1a1a1a" stroke="#fff" stroke-width="0.25"/>
  <circle cx="33" cy="65" r="4.5" fill="#fafafa"/>
  <line x1="33" y1="65" x2="33" y2="61" stroke="#000" stroke-width="0.4" stroke-linecap="round"/>

  <text x="33" y="74" font-size="2.3" font-weight="700"
        fill="#fff" text-anchor="middle" letter-spacing="0.3">
    FILTER
  </text>
  <text x="33" y="76.5" font-size="1.4" fill="#7fc8ff" text-anchor="middle">
    + hold → EXCITE
  </text>

  <!-- ============== LEVEL 1 / LEVEL 2 trimmers ============== -->
  <circle cx="11"   cy="85" r="2.8" fill="#1a1a1a" stroke="#fff" stroke-width="0.2"/>
  <circle cx="11"   cy="85" r="2.2" fill="#fafafa"/>
  <line x1="11" y1="85" x2="11" y2="82.8" stroke="#000" stroke-width="0.3" stroke-linecap="round"/>

  <circle cx="20.5" cy="85" r="2.8" fill="#1a1a1a" stroke="#fff" stroke-width="0.2"/>
  <circle cx="20.5" cy="85" r="2.2" fill="#fafafa"/>
  <line x1="20.5" y1="85" x2="20.5" y2="82.8" stroke="#000" stroke-width="0.3" stroke-linecap="round"/>

  <text x="11"   y="90.5" font-size="1.7" font-weight="700"
        fill="#fff" text-anchor="middle">DAMP</text>
  <text x="11"   y="92.5" font-size="1.2" fill="#7fc8ff" text-anchor="middle">+ SMEAR</text>

  <text x="20.5" y="90.5" font-size="1.7" font-weight="700"
        fill="#fff" text-anchor="middle">REV WET</text>
  <text x="20.5" y="92.5" font-size="1.2" fill="#7fc8ff" text-anchor="middle">+ REV SIZE</text>

  <!-- ============== separator before jack rows ============== -->
  <line x1="3" y1="96" x2="47.5" y2="96" stroke="#444" stroke-width="0.15"/>

  <!-- ============== CV jack row (top) ============== -->
  <g>
    <!-- jack 1 = LEVEL 1 CV → DAMP CV -->
    <circle cx="8"  cy="103" r="2.4" fill="#1a1a1a" stroke="#888" stroke-width="0.2"/>
    <circle cx="8"  cy="103" r="1.0" fill="#0a0a0a"/>
    <text x="8"  y="99.4"  font-size="1.4"  fill="#fff" text-anchor="middle" font-weight="700">DAMP</text>
    <text x="8"  y="100.7" font-size="0.95" fill="#888" text-anchor="middle">CV</text>

    <!-- jack 2 = LEVEL 2 CV → REV WET CV -->
    <circle cx="19" cy="103" r="2.4" fill="#1a1a1a" stroke="#888" stroke-width="0.2"/>
    <circle cx="19" cy="103" r="1.0" fill="#0a0a0a"/>
    <text x="19" y="99.4"  font-size="1.4"  fill="#fff" text-anchor="middle" font-weight="700">REV WET</text>
    <text x="19" y="100.7" font-size="0.95" fill="#888" text-anchor="middle">CV</text>

    <!-- jack 3 = ALGO CV → CHORD CV -->
    <circle cx="30" cy="103" r="2.4" fill="#1a1a1a" stroke="#888" stroke-width="0.2"/>
    <circle cx="30" cy="103" r="1.0" fill="#0a0a0a"/>
    <text x="30" y="99.4"  font-size="1.4"  fill="#fff" text-anchor="middle" font-weight="700">CHORD</text>
    <text x="30" y="100.7" font-size="0.95" fill="#888" text-anchor="middle">CV</text>

    <!-- jack 4 = PARAMETER CV → FILTER CV -->
    <circle cx="41" cy="103" r="2.4" fill="#1a1a1a" stroke="#888" stroke-width="0.2"/>
    <circle cx="41" cy="103" r="1.0" fill="#0a0a0a"/>
    <text x="41" y="99.4"  font-size="1.4"  fill="#fff" text-anchor="middle" font-weight="700">FILTER</text>
    <text x="41" y="100.7" font-size="0.95" fill="#888" text-anchor="middle">CV</text>
  </g>

  <!-- ============== Audio jack row (bottom) ============== -->
  <g>
    <!-- jack 1 = audio in L → KS excitement -->
    <circle cx="8"  cy="115" r="2.4" fill="#1a1a1a" stroke="#7fc8ff" stroke-width="0.25"/>
    <circle cx="8"  cy="115" r="1.0" fill="#0a0a0a"/>
    <text x="8"  y="119" font-size="1.4" fill="#7fc8ff" text-anchor="middle" font-weight="700">EXCITE</text>
    <text x="8"  y="120.7" font-size="0.95" fill="#888" text-anchor="middle">audio</text>

    <!-- jack 2 = audio in R → envelope-follower trigger -->
    <circle cx="19" cy="115" r="2.4" fill="#1a1a1a" stroke="#ff9030" stroke-width="0.25"/>
    <circle cx="19" cy="115" r="1.0" fill="#0a0a0a"/>
    <text x="19" y="119" font-size="1.4" fill="#ff9030" text-anchor="middle" font-weight="700">TRIG</text>
    <text x="19" y="120.7" font-size="0.95" fill="#888" text-anchor="middle">gate/lfo</text>

    <!-- jack 3 = stereo output L -->
    <circle cx="30" cy="115" r="2.4" fill="#1a1a1a" stroke="#ffd060" stroke-width="0.25"/>
    <circle cx="30" cy="115" r="1.0" fill="#0a0a0a"/>
    <text x="30" y="120" font-size="1.6" fill="#ffd060" text-anchor="middle" font-weight="700">OUT L</text>

    <!-- jack 4 = stereo output R -->
    <circle cx="41" cy="115" r="2.4" fill="#1a1a1a" stroke="#ffd060" stroke-width="0.25"/>
    <circle cx="41" cy="115" r="1.0" fill="#0a0a0a"/>
    <text x="41" y="120" font-size="1.6" fill="#ffd060" text-anchor="middle" font-weight="700">OUT R</text>
  </g>

  <!-- bottom separator -->
  <line x1="3" y1="122.5" x2="47.5" y2="122.5" stroke="#444" stroke-width="0.15"/>

  <!-- ============== off-panel legend ============== -->
  <g transform="translate(53, 0)">
    <rect x="0" y="0" width="47" height="128.5" fill="#111" stroke="#222" stroke-width="0.2"/>

    <text x="23.5" y="6.5" font-size="2.4" font-weight="700"
          fill="#fff" text-anchor="middle" letter-spacing="0.3">CHORD ZONES</text>
    <text x="23.5" y="9.5" font-size="1.3" fill="#888" text-anchor="middle">
      sweep CHORD knob CCW → CW
    </text>
    <line x1="2" y1="11" x2="45" y2="11" stroke="#333" stroke-width="0.15"/>

    <!-- 8 zone rows: swatch + name + ratios -->
    <!-- y-row spacing = 11.5 -->
    <g font-size="1.6">

      <!-- 0 unison -->
      <rect x="3" y="14" width="6" height="5" fill="#ffffff" stroke="#fff" stroke-width="0.15" opacity="0.5"/>
      <text x="3" y="22.8" font-size="1.0" fill="#888">blink</text>
      <text x="11" y="17.4" fill="#fff" font-weight="700">unison detune</text>
      <text x="11" y="20.2" fill="#888" font-size="1.2">0→edge: spread 0→±1.2 %</text>

      <!-- 1 octaves -->
      <rect x="3" y="25.5" width="6" height="5" fill="#ffffff" stroke="#fff" stroke-width="0.15"/>
      <text x="11" y="28.9" fill="#fff" font-weight="700">octaves</text>
      <text x="11" y="31.7" fill="#888" font-size="1.2">1 · 2 · 2 · 4</text>

      <!-- 2 open 5th -->
      <rect x="3" y="37" width="6" height="5" fill="#ffb400" stroke="#fff" stroke-width="0.15"/>
      <text x="11" y="40.4" fill="#fff" font-weight="700">open 5th</text>
      <text x="11" y="43.2" fill="#888" font-size="1.2">1 · 3/2 · 2 · 3</text>

      <!-- 3 minor -->
      <rect x="3" y="48.5" width="6" height="5" fill="#0030ff" stroke="#fff" stroke-width="0.15"/>
      <text x="11" y="51.9" fill="#fff" font-weight="700">minor</text>
      <text x="11" y="54.7" fill="#888" font-size="1.2">1 · 6/5 · 3/2 · 2</text>

      <!-- 4 min7 -->
      <rect x="3" y="60" width="6" height="5" fill="#7830ff" stroke="#fff" stroke-width="0.15"/>
      <text x="11" y="63.4" fill="#fff" font-weight="700">min7</text>
      <text x="11" y="66.2" fill="#888" font-size="1.2">1 · 6/5 · 3/2 · 9/5</text>

      <!-- 5 sus4 -->
      <rect x="3" y="71.5" width="6" height="5" fill="#30c8ff" stroke="#fff" stroke-width="0.15"/>
      <text x="11" y="74.9" fill="#fff" font-weight="700">sus4</text>
      <text x="11" y="77.7" fill="#888" font-size="1.2">1 · 4/3 · 3/2 · 2</text>

      <!-- 6 major -->
      <rect x="3" y="83" width="6" height="5" fill="#00ff30" stroke="#fff" stroke-width="0.15"/>
      <text x="11" y="86.4" fill="#fff" font-weight="700">major</text>
      <text x="11" y="89.2" fill="#888" font-size="1.2">1 · 5/4 · 3/2 · 2</text>

      <!-- 7 maj7 -->
      <rect x="3" y="94.5" width="6" height="5" fill="#ff5800" stroke="#fff" stroke-width="0.15"/>
      <text x="11" y="97.9" fill="#fff" font-weight="700">maj7</text>
      <text x="11" y="100.7" fill="#888" font-size="1.2">1 · 5/4 · 3/2 · 15/8</text>
    </g>

    <line x1="2" y1="106" x2="45" y2="106" stroke="#333" stroke-width="0.15"/>

    <text x="3" y="110" font-size="1.4" font-weight="700" fill="#fff">notes</text>
    <text x="3" y="113.2" font-size="1.2" fill="#aaa">IN L: audio routed through the strings</text>
    <text x="3" y="115.6" font-size="1.2" fill="#aaa">IN R: trigger/gate/lfo → pluck on rise</text>
    <text x="3" y="118.0" font-size="1.2" fill="#aaa">main LED: chord color (white = shift)</text>
    <text x="3" y="120.4" font-size="1.2" fill="#aaa">OSC LED: orange flash on each pluck</text>
    <text x="3" y="122.8" font-size="1.2" fill="#aaa">drone is also self-excited via EXCITE pot</text>
  </g>
</svg>
