<?xml version="1.0" encoding="UTF-8"?>
<!--
  Panel cheatsheet for warps_drone — page-based drone fw.
  Left half = printable 10 HP sticker overlay (panel labels).
  Right half = off-panel reference (big readable type).

  Update whenever cv_scaler.cc dispatch lines or the chord zone
  widths change. Knob nicknames: Big (algorithm_), Small (timbre_),
  LVL 1 and LVL 2 (the trimmers).
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="220mm" height="200mm"
     viewBox="0 0 220 200"
     font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">

  <!-- ============================================================ -->
  <!-- panel base (10 HP sticker area)                              -->
  <!-- ============================================================ -->
  <rect x="0" y="0" width="50.5" height="128.5"
        fill="#0a0a0a" stroke="#000" stroke-width="0.2"/>

  <g fill="#1a1a1a">
    <circle cx="3.0"  cy="3.0"   r="1.5"/>
    <circle cx="47.5" cy="3.0"   r="1.5"/>
    <circle cx="3.0"  cy="125.5" r="1.5"/>
    <circle cx="47.5" cy="125.5" r="1.5"/>
  </g>

  <text x="25.25" y="6.5" font-size="2.8" font-weight="700"
        fill="#fff" text-anchor="middle" letter-spacing="0.4">DRONE</text>
  <text x="25.25" y="9.8" font-size="1.7" fill="#888"
        text-anchor="middle" letter-spacing="0.5">karplus fw</text>
  <line x1="3" y1="11.5" x2="47.5" y2="11.5" stroke="#444" stroke-width="0.15"/>

  <!-- Big knob -->
  <circle cx="25.25" cy="33" r="11" fill="#1a1a1a" stroke="#fff" stroke-width="0.3"/>
  <circle cx="25.25" cy="33" r="9.5" fill="#fafafa"/>
  <line x1="25.25" y1="33" x2="25.25" y2="24.5" stroke="#000" stroke-width="0.5" stroke-linecap="round"/>
  <text x="25.25" y="49.5" font-size="3.2" font-weight="700"
        fill="#fff" text-anchor="middle" letter-spacing="0.3">BIG</text>
  <text x="25.25" y="52.5" font-size="1.5" fill="#888" text-anchor="middle">per-page • +shift</text>

  <!-- Button + OSC LED -->
  <circle cx="9.5"  cy="65" r="2.2" fill="#fafafa" stroke="#fff" stroke-width="0.2"/>
  <circle cx="13.8" cy="63.5" r="0.7" fill="#ff8400"/>
  <text x="9.5" y="69.5" font-size="1.6" font-weight="700"
        fill="#fff" text-anchor="middle">BUTTON</text>
  <text x="9.5" y="71.5" font-size="1.2" fill="#ffae40" text-anchor="middle">tap = page</text>
  <text x="9.5" y="73.2" font-size="1.2" fill="#7fc8ff" text-anchor="middle">hold = shift</text>

  <!-- Small knob -->
  <circle cx="33" cy="65" r="5.5" fill="#1a1a1a" stroke="#fff" stroke-width="0.25"/>
  <circle cx="33" cy="65" r="4.5" fill="#fafafa"/>
  <line x1="33" y1="65" x2="33" y2="61" stroke="#000" stroke-width="0.4" stroke-linecap="round"/>
  <text x="33" y="74" font-size="2.5" font-weight="700"
        fill="#fff" text-anchor="middle">SMALL</text>
  <text x="33" y="76.7" font-size="1.4" fill="#888" text-anchor="middle">per-page • +shift</text>

  <!-- LEVEL 1 + LEVEL 2 trimmers -->
  <circle cx="11"   cy="85" r="2.8" fill="#1a1a1a" stroke="#fff" stroke-width="0.2"/>
  <circle cx="11"   cy="85" r="2.2" fill="#fafafa"/>
  <line x1="11" y1="85" x2="11" y2="82.8" stroke="#000" stroke-width="0.3" stroke-linecap="round"/>

  <circle cx="20.5" cy="85" r="2.8" fill="#1a1a1a" stroke="#fff" stroke-width="0.2"/>
  <circle cx="20.5" cy="85" r="2.2" fill="#fafafa"/>
  <line x1="20.5" y1="85" x2="20.5" y2="82.8" stroke="#000" stroke-width="0.3" stroke-linecap="round"/>

  <text x="11"   y="91" font-size="1.9" font-weight="700" fill="#fff" text-anchor="middle">LVL 1</text>
  <text x="20.5" y="91" font-size="1.9" font-weight="700" fill="#fff" text-anchor="middle">LVL 2</text>

  <line x1="3" y1="96" x2="47.5" y2="96" stroke="#444" stroke-width="0.15"/>

  <!-- CV jacks -->
  <g>
    <circle cx="8"  cy="103" r="2.4" fill="#1a1a1a" stroke="#7fc8ff" stroke-width="0.2"/>
    <circle cx="8"  cy="103" r="1.0" fill="#0a0a0a"/>
    <text x="8"  y="99.4"  font-size="1.5" fill="#7fc8ff" text-anchor="middle" font-weight="700">PITCH</text>
    <text x="8"  y="101"   font-size="1.0" fill="#888"    text-anchor="middle">V/oct</text>

    <circle cx="19" cy="103" r="2.4" fill="#1a1a1a" stroke="#888" stroke-width="0.2"/>
    <circle cx="19" cy="103" r="1.0" fill="#0a0a0a"/>
    <text x="19" y="99.4"  font-size="1.5" fill="#fff" text-anchor="middle" font-weight="700">REV WET</text>
    <text x="19" y="101"   font-size="1.0" fill="#888" text-anchor="middle">CV</text>

    <circle cx="30" cy="103" r="2.4" fill="#1a1a1a" stroke="#888" stroke-width="0.2"/>
    <circle cx="30" cy="103" r="1.0" fill="#0a0a0a"/>
    <text x="30" y="99.4"  font-size="1.5" fill="#fff" text-anchor="middle" font-weight="700">CHORD</text>
    <text x="30" y="101"   font-size="1.0" fill="#888" text-anchor="middle">CV</text>

    <circle cx="41" cy="103" r="2.4" fill="#1a1a1a" stroke="#888" stroke-width="0.2"/>
    <circle cx="41" cy="103" r="1.0" fill="#0a0a0a"/>
    <text x="41" y="99.4"  font-size="1.5" fill="#fff" text-anchor="middle" font-weight="700">LPF</text>
    <text x="41" y="101"   font-size="1.0" fill="#888" text-anchor="middle">CV</text>
  </g>

  <!-- Audio jacks -->
  <g>
    <circle cx="8"  cy="115" r="2.4" fill="#1a1a1a" stroke="#7fc8ff" stroke-width="0.25"/>
    <circle cx="8"  cy="115" r="1.0" fill="#0a0a0a"/>
    <text x="8"  y="119.3" font-size="1.5" fill="#7fc8ff" text-anchor="middle" font-weight="700">EXCITE</text>
    <text x="8"  y="121"   font-size="1.0" fill="#888"    text-anchor="middle">audio</text>

    <circle cx="19" cy="115" r="2.4" fill="#1a1a1a" stroke="#ff9030" stroke-width="0.25"/>
    <circle cx="19" cy="115" r="1.0" fill="#0a0a0a"/>
    <text x="19" y="119.3" font-size="1.5" fill="#ff9030" text-anchor="middle" font-weight="700">TRIG</text>
    <text x="19" y="121"   font-size="1.0" fill="#888"    text-anchor="middle">gate/lfo</text>

    <circle cx="30" cy="115" r="2.4" fill="#1a1a1a" stroke="#ffd060" stroke-width="0.25"/>
    <circle cx="30" cy="115" r="1.0" fill="#0a0a0a"/>
    <text x="30" y="120.3" font-size="1.7" fill="#ffd060" text-anchor="middle" font-weight="700">OUT L</text>

    <circle cx="41" cy="115" r="2.4" fill="#1a1a1a" stroke="#ffd060" stroke-width="0.25"/>
    <circle cx="41" cy="115" r="1.0" fill="#0a0a0a"/>
    <text x="41" y="120.3" font-size="1.7" fill="#ffd060" text-anchor="middle" font-weight="700">OUT R</text>
  </g>

  <line x1="3" y1="123" x2="47.5" y2="123" stroke="#444" stroke-width="0.15"/>

  <!-- ============================================================ -->
  <!-- off-panel page reference  (BIG TYPE)                         -->
  <!-- ============================================================ -->
  <g transform="translate(55, 0)">
    <rect x="0" y="0" width="165" height="155" fill="#111" stroke="#222" stroke-width="0.2"/>

    <text x="82.5" y="11" font-size="5.5" font-weight="700"
          fill="#fff" text-anchor="middle" letter-spacing="0.6">PAGES</text>
    <text x="82.5" y="16.5" font-size="2.4" fill="#888" text-anchor="middle">
      tap to cycle • hold for shift layer
    </text>
    <line x1="3" y1="19" x2="162" y2="19" stroke="#333" stroke-width="0.2"/>

    <!-- column headers -->
    <g font-size="2.8" font-weight="700" fill="#aaa">
      <text x="3"    y="24.5">PAGE</text>
      <text x="44"   y="24.5">BIG</text>
      <text x="76"   y="24.5">SMALL</text>
      <text x="108"  y="24.5">LVL 1</text>
      <text x="138"  y="24.5">LVL 2</text>
    </g>
    <line x1="3" y1="26.5" x2="162" y2="26.5" stroke="#333" stroke-width="0.15"/>

    <!-- ───── PAGE 0 PERFORMANCE ───── -->
    <rect x="3" y="30" width="5" height="20" fill="#222" stroke="#444" stroke-width="0.1"/>
    <text x="11" y="35.5" font-size="2.9" font-weight="700" fill="#fff">PERFORMANCE</text>
    <text x="11" y="39.0" font-size="1.8" fill="#888">unlit • live play</text>
    <g font-size="2.5" fill="#fff">
      <text x="44"  y="35.5">chord <tspan fill="#7fc8ff">+CV</tspan></text>
      <text x="44"  y="40.0" fill="#7fc8ff">+ mode</text>
      <text x="76"  y="35.5">LPF cut <tspan fill="#7fc8ff">+CV</tspan></text>
      <text x="76"  y="40.0" fill="#7fc8ff">+ HPF cut</text>
      <text x="108" y="35.5">octave <tspan fill="#7fc8ff">+V/oct</tspan></text>
      <text x="108" y="40.0" fill="#7fc8ff">+ pitch (semi)</text>
      <text x="138" y="35.5">rev wet <tspan fill="#7fc8ff">+CV</tspan></text>
      <text x="138" y="40.0" fill="#7fc8ff">+ filter Q</text>
    </g>
    <line x1="3" y1="52" x2="162" y2="52" stroke="#333" stroke-width="0.15"/>

    <!-- ───── PAGE 1 KARPLUS ───── -->
    <rect x="3" y="55" width="5" height="20" fill="#00ff30" stroke="#444" stroke-width="0.1"/>
    <text x="11" y="60.5" font-size="2.9" font-weight="700" fill="#fff">KARPLUS</text>
    <text x="11" y="64.0" font-size="1.8" fill="#888">green • exciter</text>
    <g font-size="2.5" fill="#fff">
      <text x="44"  y="60.5">burst</text>
      <text x="44"  y="65.0" fill="#7fc8ff">+ pluck amp</text>
      <text x="76"  y="60.5">pluck len</text>
      <text x="76"  y="65.0" fill="#7fc8ff">+ damping</text>
      <text x="108" y="60.5">LFO rate</text>
      <text x="108" y="65.0" fill="#7fc8ff">+ ks LPF</text>
      <text x="138" y="60.5">noise floor</text>
      <text x="138" y="65.0" fill="#7fc8ff">+ wht/pnk</text>
    </g>
    <line x1="3" y1="77" x2="162" y2="77" stroke="#333" stroke-width="0.15"/>

    <!-- ───── PAGE 2 REVERB ───── -->
    <rect x="3" y="80" width="5" height="20" fill="#ff8400" stroke="#444" stroke-width="0.1"/>
    <text x="11" y="85.5" font-size="2.9" font-weight="700" fill="#fff">REVERB</text>
    <text x="11" y="89.0" font-size="1.8" fill="#888">orange • space</text>
    <g font-size="2.5" fill="#fff">
      <text x="44"  y="85.5">size</text>
      <text x="44"  y="90.0" fill="#888">+ predelay (NYI)</text>
      <text x="76"  y="85.5">diffusion</text>
      <text x="76"  y="90.0" fill="#7fc8ff">+ smear</text>
      <text x="108" y="85.5">HF damp</text>
      <text x="108" y="90.0" fill="#7fc8ff">+ drive</text>
      <text x="138" y="85.5">rev wet <tspan fill="#7fc8ff">+CV</tspan></text>
      <text x="138" y="90.0" fill="#888">+ reserved</text>
    </g>
    <line x1="3" y1="102" x2="162" y2="102" stroke="#333" stroke-width="0.15"/>

    <!-- ───── PAGE 3 SHIMMER (placeholder) ───── -->
    <rect x="3" y="105" width="5" height="14" fill="#ff0030" stroke="#444" stroke-width="0.1"/>
    <text x="11" y="110.5" font-size="2.9" font-weight="700" fill="#fff">SHIMMER</text>
    <text x="11" y="114.0" font-size="1.8" fill="#888">red • all NYI</text>
    <text x="44" y="110.5" font-size="2.2" fill="#888">harmonics, brightness, stiffness, dynamics</text>
    <text x="44" y="114.0" font-size="2.2" fill="#888">+ mode count, pickup, shim depth, shim rate</text>
    <line x1="3" y1="121" x2="162" y2="121" stroke="#333" stroke-width="0.15"/>

    <!-- ───── Chord stack zones ───── -->
    <text x="3" y="127" font-size="2.4" font-weight="700" fill="#fff">Chord stack zones on BIG knob</text>
    <g font-size="2.1" fill="#aaa">
      <text x="3" y="131">0.00–0.03 <tspan fill="#fff">unison</tspan>  ·  0.03–0.40 <tspan fill="#fff">detune (phat)</tspan>  ·  0.40–0.55 <tspan fill="#fff">+3rd</tspan></text>
      <text x="3" y="134.5">0.55–0.70 <tspan fill="#fff">+5th</tspan>  ·  0.70–0.85 <tspan fill="#fff">+7th</tspan>  ·  0.85–1.00 <tspan fill="#fff">+9th</tspan></text>
      <text x="3" y="138">Modes (BIG + shift):  major / minor / dom7 / dim / sus2 / sus4</text>
      <text x="3" y="141.5">Sub-osc: 3 saws mirroring the first 3 chord ratios, shifted −1 oct (detune + chord-progression follow the BIG knob)</text>
    </g>

    <!-- ───── Burst shape morph (BIG on KARPLUS page) ───── -->
    <text x="3" y="144" font-size="2.4" font-weight="700" fill="#fff">Burst shape on KARPLUS BIG knob (every 1/8 turn)</text>

    <!-- 9 mini plots: bs = 0/8, 1/8, …, 8/8.  CCW = short discrete gate,
         CW = slow swell.  Below bs = 0.333 the burst length grows from
         a fixed ~10 ms gate toward the full pluck length, AND the
         envelope morphs rect → −saw.  Above 0.333 length stays full and
         the envelope morphs −saw → tri → saw.  Each plot's x-axis is
         the full pluck-length window — narrow plots = short bursts.   -->
    <g>
      <!-- plot 0  bs = 0.00  GATE (short rect, ~10 ms regardless of pluck_len) -->
      <rect x="4" y="147" width="14" height="9" fill="#0a0a0a" stroke="#333" stroke-width="0.1"/>
      <line x1="5" y1="155.5" x2="17" y2="155.5" stroke="#222" stroke-width="0.1"/>
      <polyline fill="none" stroke="#7fc8ff" stroke-width="0.4"
                points="5,148.5 6.2,148.5 6.2,155.5 17,155.5"/>
      <text x="11" y="159" font-size="1.6" fill="#888" text-anchor="middle">0.00</text>
      <text x="11" y="161" font-size="1.5" font-weight="700" fill="#7fc8ff" text-anchor="middle">gate</text>

      <!-- plot 1  bs = 0.125  rect→−saw blend, length ~40% of full -->
      <rect x="21" y="147" width="14" height="9" fill="#0a0a0a" stroke="#333" stroke-width="0.1"/>
      <line x1="22" y1="155.5" x2="34" y2="155.5" stroke="#222" stroke-width="0.1"/>
      <polyline fill="none" stroke="#7fc8ff" stroke-width="0.4"
                points="22,148.5 26.69,151.125 26.69,155.5 34,155.5"/>
      <text x="28" y="159" font-size="1.6" fill="#888" text-anchor="middle">0.13</text>

      <!-- plot 2  bs = 0.25  rect→−saw blend, length ~76% of full -->
      <rect x="38" y="147" width="14" height="9" fill="#0a0a0a" stroke="#333" stroke-width="0.1"/>
      <line x1="39" y1="155.5" x2="51" y2="155.5" stroke="#222" stroke-width="0.1"/>
      <polyline fill="none" stroke="#7fc8ff" stroke-width="0.4"
                points="39,148.5 48.07,153.75 48.07,155.5 51,155.5"/>
      <text x="45" y="159" font-size="1.6" fill="#888" text-anchor="middle">0.25</text>

      <!-- plot 3  bs = 0.375  ≈−saw -->
      <rect x="55" y="147" width="14" height="9" fill="#0a0a0a" stroke="#333" stroke-width="0.1"/>
      <line x1="56" y1="155.5" x2="68" y2="155.5" stroke="#222" stroke-width="0.1"/>
      <polyline fill="none" stroke="#7fc8ff" stroke-width="0.4"
                points="56,149.375 62,151.5625 68,155.5"/>
      <text x="62" y="159" font-size="1.6" fill="#888" text-anchor="middle">0.38</text>
      <text x="62" y="161" font-size="1.5" font-weight="700" fill="#7fc8ff" text-anchor="middle">≈−saw</text>

      <!-- plot 4  bs = 0.5 -->
      <rect x="72" y="147" width="14" height="9" fill="#0a0a0a" stroke="#333" stroke-width="0.1"/>
      <line x1="73" y1="155.5" x2="85" y2="155.5" stroke="#222" stroke-width="0.1"/>
      <polyline fill="none" stroke="#7fc8ff" stroke-width="0.4"
                points="73,152 79,150.25 85,155.5"/>
      <text x="79" y="159" font-size="1.6" fill="#888" text-anchor="middle">0.50</text>

      <!-- plot 5  bs = 0.625 -->
      <rect x="89" y="147" width="14" height="9" fill="#0a0a0a" stroke="#333" stroke-width="0.1"/>
      <line x1="90" y1="155.5" x2="102" y2="155.5" stroke="#222" stroke-width="0.1"/>
      <polyline fill="none" stroke="#7fc8ff" stroke-width="0.4"
                points="90,154.625 96,148.9375 102,155.5"/>
      <text x="96" y="159" font-size="1.6" fill="#888" text-anchor="middle">0.63</text>
      <text x="96" y="161" font-size="1.5" font-weight="700" fill="#7fc8ff" text-anchor="middle">≈tri</text>

      <!-- plot 6  bs = 0.75 -->
      <rect x="106" y="147" width="14" height="9" fill="#0a0a0a" stroke="#333" stroke-width="0.1"/>
      <line x1="107" y1="155.5" x2="119" y2="155.5" stroke="#222" stroke-width="0.1"/>
      <polyline fill="none" stroke="#7fc8ff" stroke-width="0.4"
                points="107,155.5 113,149.375 119,153.75"/>
      <text x="113" y="159" font-size="1.6" fill="#888" text-anchor="middle">0.75</text>

      <!-- plot 7  bs = 0.875 -->
      <rect x="123" y="147" width="14" height="9" fill="#0a0a0a" stroke="#333" stroke-width="0.1"/>
      <line x1="124" y1="155.5" x2="136" y2="155.5" stroke="#222" stroke-width="0.1"/>
      <polyline fill="none" stroke="#7fc8ff" stroke-width="0.4"
                points="124,155.5 130,150.6875 136,151.125"/>
      <text x="130" y="159" font-size="1.6" fill="#888" text-anchor="middle">0.88</text>

      <!-- plot 8  bs = 1.0  SAW -->
      <rect x="140" y="147" width="14" height="9" fill="#0a0a0a" stroke="#333" stroke-width="0.1"/>
      <line x1="141" y1="155.5" x2="153" y2="155.5" stroke="#222" stroke-width="0.1"/>
      <polyline fill="none" stroke="#7fc8ff" stroke-width="0.4"
                points="141,155.5 147,152 153,148.5"/>
      <text x="147" y="159" font-size="1.6" fill="#888" text-anchor="middle">1.00</text>
      <text x="147" y="161" font-size="1.5" font-weight="700" fill="#7fc8ff" text-anchor="middle">saw</text>
    </g>

    <!-- exact landmarks fall between 1/8 columns: −saw at 0.333, tri at 0.667 -->
    <text x="3" y="164.5" font-size="1.7" fill="#888">
      morph corners: <tspan fill="#fff">0.000 gate</tspan> · <tspan fill="#fff">0.333 −saw</tspan> · <tspan fill="#fff">0.667 tri</tspan> · <tspan fill="#fff">1.000 saw</tspan>.
      Below 0.333 length grows from a fixed 10 ms gate to the full pluck_len; above 0.333 length = pluck_len.
    </text>

    <line x1="3" y1="167" x2="162" y2="167" stroke="#333" stroke-width="0.15"/>

    <!-- ───── LED + I/O notes ───── -->
    <text x="3" y="171" font-size="2.4" font-weight="700" fill="#fff">LEDs &amp; I/O</text>
    <g font-size="2.1" fill="#aaa">
      <text x="3"  y="174.5">Main LED unshifted: stack-zone colour (white / cyan / green / amber / orange / red as you rotate CW)</text>
      <text x="3"  y="177">Main LED shifted on Page 0: chord-mode colour (green/blue/amber/red/cyan/violet = major/minor/dom7/dim/sus2/sus4). Solid red = clip.</text>
      <text x="3"  y="179.5">OSC LED: off / green / orange / red = page. Doubles as calibration indicator (see below).</text>
      <text x="3"  y="182">PITCH CV = 1 V/oct chromatic • IN L excites • IN R triggers re-pluck.</text>
    </g>

    <!-- ───── V/oct calibration ritual ───── -->
    <text x="3" y="187" font-size="2.4" font-weight="700" fill="#fff">V/oct calibration</text>
    <g font-size="2.1" fill="#aaa">
      <text x="3"  y="190.5">Power on with button HELD, nothing patched to PITCH. OSC LED blinks <tspan fill="#00ff30">green</tspan> = C1 ready.</text>
      <text x="3"  y="193">Release button → unpatched bias auto-captured as 0 V anchor. Patch +1 V, press → blinks <tspan fill="#ffd060">yellow</tspan> = C3 ready.</text>
      <text x="3"  y="195.5">Patch +3 V, press → solid <tspan fill="#00ff30">green</tspan> = saved to flash sector 2 (survives reflash), or solid <tspan fill="#ff5040">red</tspan> = bad delta, retry.</text>
    </g>
  </g>
</svg>
